0} 75.000%{opacity:0} 77.500%{opacity:1} 97.500%{opacity:1} 100.000%{opacity:0} 100.000%{opacity:0}}.p3{opacity:0;animation:p3 24s linear infinite}.o3{opacity:0;animation:o3 24s linear infinite}.l3{opacity:0;animation:l3 24s linear infinite}</style>
