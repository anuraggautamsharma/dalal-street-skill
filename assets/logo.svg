<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dalal Street Skill logo: three rising candlesticks in saffron, white and green">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14305A"/>
      <stop offset="1" stop-color="#081A33"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#22B04B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- chart grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3">
    <line x1="88" y1="160" x2="424" y2="160"/>
    <line x1="88" y1="256" x2="424" y2="256"/>
    <line x1="88" y1="352" x2="424" y2="352"/>
  </g>

  <!-- three rising candles: saffron, white, green -->
  <g stroke-linecap="round">
    <line x1="152" y1="262" x2="152" y2="412" stroke="#FF9933" stroke-width="12"/>
    <rect x="118" y="292" width="68" height="94" rx="14" fill="#FF9933"/>

    <line x1="256" y1="186" x2="256" y2="350" stroke="#F4F6FA" stroke-width="12"/>
    <rect x="222" y="214" width="68" height="110" rx="14" fill="#F4F6FA"/>

    <line x1="360" y1="96" x2="360" y2="286" stroke="#22B04B" stroke-width="12"/>
    <rect x="326" y="122" width="68" height="132" rx="14" fill="#22B04B"/>
  </g>

  <!-- rising trend line with arrow -->
  <g filter="url(#glow)" fill="none" stroke="url(#trend)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 404 L196 330 L262 360 L410 218"/>
  </g>
  <path d="M431 198 L386 207 L420 243 Z" fill="#22B04B" stroke="#22B04B" stroke-width="8" stroke-linejoin="round"/>
</svg>
